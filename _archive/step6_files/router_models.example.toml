# Copy to router_models.toml and edit. Models for the router's LLM jobs (plan.md 3.2.12).
# Each table is a hagent ModelConfig, so any OpenAI-compatible chat endpoint works.
# This is NOT hagent's config file: hagent rejects unknown sections, so these tables live here.
#
# `model` values are PLACEHOLDERS. Use the exact ids your provider lists. TODO(verify): all of them.
# No model below ever decides a route. A job whose table is missing is simply not configured.

[report]           # Nemotron 3 Super 120B: verdict + evidence -> summary, hagent task, ranked localization
model = "REPLACE_WITH_NEMOTRON_3_SUPER_ID"
base_url = "https://integrate.api.nvidia.com/v1"
api_key_env = "NVIDIA_API_KEY"
temperature = 0.0
max_tokens = 2048
price_in_per_mtok = 0.0
price_out_per_mtok = 0.0

[mapper]           # Nemotron 3 Nano 30B: proposes training-spec -> eval-config key mapping, once per policy
model = "REPLACE_WITH_NEMOTRON_3_NANO_ID"
base_url = "https://integrate.api.nvidia.com/v1"
api_key_env = "NVIDIA_API_KEY"
temperature = 0.0
max_tokens = 1024
price_in_per_mtok = 0.0
price_out_per_mtok = 0.0

[factor_search]    # Cosmos3-Super-Reasoner: verdict row 9 only; sees nominal vs failing policy-input frames
# TODO(verify): the endpoint accepts images only or video too, and OpenAI-style image_url content parts.
model = "REPLACE_WITH_COSMOS3_SUPER_REASONER_ID"
base_url = "https://integrate.api.nvidia.com/v1"
api_key_env = "NVIDIA_API_KEY"
temperature = 0.0
max_tokens = 1024
price_in_per_mtok = 0.0
price_out_per_mtok = 0.0
