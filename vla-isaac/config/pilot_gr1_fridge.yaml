# Pilot task (docs/PILOT_AND_ORDER.md, decision 2): GR1 put_item_in_fridge_and_close_door, ranch bottle.
# Every task-specific value lives here; a DROID pilot is a new file of this shape.
nominal_scene: gr1_fridge_ranch
environment:                              # experiment-YAML environment block (VERIFY(V-exp-yaml))
  type: put_item_in_fridge_and_close_door
  embodiment: gr1_joint
  object: ranch_dressing_hope_robolab
  enable_cameras: true
environment_class: "isaaclab_arena_environments.gr1_put_and_close_door_environment:GR1PutAndCloseDoorEnvironment"
actuated_environment_type: vla_put_item_in_fridge_and_close_door_actuated
environment_checks:                       # the code's eval.yaml must name the same environment
  type: env.task
  embodiment: env.embodiment
  object: env.object
policy:
  type: policy_wrapper.policy.gr00t_remote_closedloop_policy.Gr00tRemoteClosedloopPolicy
  config_path: config/eval.yaml
serve:
  module: policy_wrapper.serve
  config_path: config/eval.yaml
eval_keys:
  language_instruction: client.language_instruction
  actuator_overrides: env.actuator_overrides
eval_config:                              # how vla_isaac.workspace reads eval.yaml (derived keys: Q3)
  image_size_key: client.target_image_size
  checkpoint_key: server.checkpoint
  norm_stats_override_key: server.norm_stats_override
  embodiment_key: server.embodiment_tag
  derived_image_hw: client.target_image_hw
  derived_norm_stats: server.effective_norm_stats
  norm_stats_groups:                      # GR1 arms-only modality key order (gr1_arms_only_data_config.py)
    state: [left_arm, right_arm, left_hand, right_hand]
    action: [left_arm, right_arm, left_hand, right_hand]
config_mapping:                           # router ConfigMapping.keys (docs/PILOT_AND_ORDER.md, with Q3)
  action_horizon: client.action_horizon
  replan_steps: client.action_chunk_length
  denoising_steps: server.denoising_steps
  control_hz: env.control_hz
  image_size: client.target_image_hw
  instruction_templates: client.language_instruction
  render_settings: env.render
  norm_stats: server.effective_norm_stats
factor_table: factors_gr1_fridge.yaml
training_spec:                            # vla_isaac.specs.extract_training_spec (Phase 4)
  policy_name: gr00t_n1d6_gr1_ranch_bottle_into_fridge
  checkpoint: nvidia/GN1.6-Tuned-Arena-GR1-PlaceItemCloseDoor-Task/ranch_bottle_into_fridge   # backend checkpoints map
  embodiment_tag: GR1
  arena_closedloop_config: isaaclab_arena_gr00t/policy/config/gr1_manip_ranch_bottle_gr00t_closedloop_config.yaml
  arena_data_config: isaaclab_arena_gr00t/embodiments/gr1/gr1_arms_only_data_config.py
  arena_modality_json: isaaclab_arena_gr00t/embodiments/gr1/modality.json
  arena_converter_config: isaaclab_arena_gr00t/lerobot/config/gr1_manip_ranch_bottle_config.yaml
  video_key: ego_view
  dataset: arena_gr1_ranch_bottle_lerobot  # backend datasets map: local LeRobot dir; absent -> instructions missing (VERIFY(V-train-instr))
  declared:                               # fields no checkpoint or Arena file records
    channel_order: RGB                    # VERIFY(V-rgb-order)
    render_settings: {}                   # Arena defaults: VERIFY(V-render-defaults)
reference:                                # RAW reference controller (vla_isaac.reference.mimic, Phase 4)
  actor_checkpoint: mimic-gr1_pink        # ActorRef.checkpoint of the reference (RouterConfig.reference_checkpoint)
  mimic:
    script: submodules/IsaacLab/scripts/imitation_learning/isaaclab_mimic/generate_dataset.py
    task: put_item_in_fridge_and_close_door
    env_args: {object: ranch_dressing_hope_robolab, embodiment: gr1_pink}
    external_callback: isaaclab_arena.environments.isaaclab_interop.environment_registration_callback
    source_dataset: ranch_bottle_into_fridge_annotated   # backend datasets map; VERIFY(V-mimic-source)
    device: cpu
    num_envs: 1                           # attempts finish one at a time, so the log orders them
    enable_cameras: true
    output:                               # PLACEHOLDER pattern: VERIFY(V-mimic-out)
      progress: '(?P<successes>\d+)/(?P<attempts>\d+) \([0-9.]+%\) successful demos generated by mimic'
    seed:                                 # datagen seed across runs: VERIFY(V-mimic-seed), day-one GPU check
      mode: fixed                         # fixed: one trial sequence, seed s = trial s; per_run: a seed per run via flag
      flag: --seed                        # PLACEHOLDER flag for per_run mode (unread)
      max_trials: 200
  qualification:                          # ISSUES #5: Wilson lower bound vs threshold
    threshold: 0.8
    confidence: 0.95
    trials: 50                            # with 20 trials only 20/20 clears 0.8 at 95 %
rung0:                                    # patches to the code under test
  forbidden_prefixes:
    - .git/
    - policy_wrapper/instrument.py        # the instrumentation: evidence the router reads about the patch
traces:                                   # vla_isaac.traces (Phase 3)
  instrument:
    obs_keys: [policy.left_eef_pos, policy.right_eef_pos]   # GR1 policy obs terms (A:isaaclab_arena/embodiments/gr1t2/gr1t2.py:381-383)
  hdf5:                                   # Isaac Lab recorder layout: VERIFY(V-hdf5-keys), export: VERIFY(V-hdf5-export)
    file_glob: "dataset_*.hdf5"
    demo_group: data
    env_id: episode_id/env_id             # Arena EpisodeIdentityRecorder (A:isaaclab_arena/terms/recorders.py:71-94)
    episode_in_env: episode_id/episode_in_env
    joint_cmd: processed_actions          # VERIFY(V-hdf5-joint-order): columns in the 36-DoF action order
    joint_pos: states/articulation/robot/joint_position     # columns in the 54-DoF state order
    object_pose: "states/rigid_object/{object}/root_pose"   # VERIFY(V-obj-state)
    object_initial_pose: "initial_state/rigid_object/{object}/root_pose"
  joints:                                 # copies of Arena's GR1 joint-space files (A:isaaclab_arena_gr00t/embodiments/gr1/)
    state: gr1/54dof_joint_space.yaml
    action: gr1/36dof_joint_space.yaml
  object: ranch_dressing_hope_robolab
  ee:                                     # GR1 has no ee_frame transformer at Arena 7632eb7d5e, so the wrapper logs the
    source: instrument                    # policy's own EE observation each step. Frame vs object pose: VERIFY(V-ee-frame)
    keys: {left: policy.left_eef_pos, right: policy.right_eef_pos}
  hand_closure:                           # (open, closed) per finger joint: PLACEHOLDER values, VERIFY(V-hand-limits).
                                          # The grasping hand is chosen per episode (vla_isaac.traces.events.choose_hand)
    hands:
      left:
        L_index_proximal_joint: [0.0, 1.5]
        L_middle_proximal_joint: [0.0, 1.5]
        L_ring_proximal_joint: [0.0, 1.5]
        L_pinky_proximal_joint: [0.0, 1.5]
      right:
        R_index_proximal_joint: [0.0, 1.5]
        R_middle_proximal_joint: [0.0, 1.5]
        R_ring_proximal_joint: [0.0, 1.5]
        R_pinky_proximal_joint: [0.0, 1.5]
  reach_distance_m: 0.10
  grasp:                                  # thresholds are first guesses, to calibrate on nominal runs
    closure_threshold: 0.5
    window: 25                            # steps (0.5 s at 50 Hz)
    min_object_motion_m: 0.02
    max_relative_motion_m: 0.03
  subtasks:                               # progress.events that complete a subtask: VERIFY(V-progress)
    lift: {criteria_name: pick_and_place, predicate_index: 1}      # object_is_above_height
    place: {criteria_name: pick_and_place, predicate_index: 2}     # object_on_destination (consecutive steps)
    close_door: {criteria_name: close_door, predicate_index: 0}    # openable_object.is_closed
  object_rest_event: {criteria_name: pick_and_place, predicate_index: 0}   # objects_settled
  phase_map:                              # task subtask -> router phase (router change 2)
    reach: reach
    grasp: grasp
    lift: lift
    place: place
    close_door: post_place
  check_episode_length: true              # instrument steps == JSONL episode_length, else the traces are refused
