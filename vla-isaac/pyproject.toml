[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-isaac"
version = "0.0.1"
requires-python = ">=3.11"
# vla-router (distribution name vla-repair-ladder) and hagent are sibling path packages, not on PyPI:
# install them in the same pip command (README.md). The names below are satisfied by those local installs.
dependencies = ["vla-repair-ladder", "pyyaml>=6"]

[project.optional-dependencies]
# Pinned to the versions the GPU-free test suite was run with (conda env vla-sim, CPU-only torch).
test = [
    "pytest==9.1.1",
    "numpy==2.5.4",
    "h5py==3.16.0",
    "pyzmq==27.2.0",
    "msgpack==1.2.4",
    "opencv-python-headless==5.0.0.93",
    "gymnasium==1.4.0",
    "torch==2.14.1",
]

[tool.setuptools.packages.find]
include = ["vla_isaac*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
